# Additions to the unbound image's default config (/etc/unbound/unbound.conf in
# klutchell/unbound), which already follows Pi-hole's unbound guide: DNSSEC
# hardening, edns-buffer-size 1232, prefetch, private-address ranges.
# Mounted into /etc/unbound/custom.conf.d/.
server:
    # OrbStack containers have no IPv6, so don't try IPv6 name servers
    # (Pi-hole's guide: "do-ip6: no" unless IPv6 works).
    do-ip6: no

    # Same as the Pi (pi/unbound/pi-hole.conf): no reverse queries for
    # non-public ranges (RFC 6303 4.2). The image already covers the private
    # LAN ranges (192.168/16, 172.16/12, 10/8, link-local, fd00::/8).
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
    private-address: 2001:db8::/32
